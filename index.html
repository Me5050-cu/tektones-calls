<style>
  :root {
    --ground: #F5EDDC; --surface: #FFFBF1; --panel: #EADFC4; --ink: #0F2340; --ink-2: #4A6382;
    --rule: #DDCEAC; --star: #EBBA1C; --star-ink: #81650B; --good: #2E6F52; --warn: #BB6022;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Host Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F2340; --surface: #16304F; --panel: #1D3A5F; --ink: #F5EDDC; --ink-2: #A9C0D8;
      --rule: #27466C; --star: #EBBA1C; --star-ink: #EBBA1C; --good: #7FC9A6; --warn: #E08A4F;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F2340; --surface: #16304F; --panel: #1D3A5F; --ink: #F5EDDC; --ink-2: #A9C0D8;
    --rule: #27466C; --star: #EBBA1C; --star-ink: #EBBA1C; --good: #7FC9A6; --warn: #E08A4F;
    color-scheme: dark;
  }

  body { background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 80px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 5vw, 2rem); line-height: 1.1; margin: 0 0 6px; }
  .sub { color: var(--ink-2); font-size: 0.95rem; margin: 0 0 16px; max-width: 62ch; }
  .label { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; border-radius: 6px; }

  /* Controls */
  .controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); padding-block: 10px; margin-inline: -16px; padding-inline: 16px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #q { flex: 1 1 220px; min-width: 0; font: 400 1rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
  select { font: 600 0.9rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 9px 10px; max-width: 46vw; }
  .chip { font: 600 0.85rem var(--body); color: var(--ink-2); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--star); border-color: var(--star); color: #0F2340; }
  .count { font-family: var(--mono); font-size: 0.76rem; color: var(--ink-2); margin-left: auto; white-space: nowrap; }

  /* Cards */
  .list { display: grid; gap: 10px; margin-top: 14px; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--rule); border-radius: 12px; padding: 14px 15px; display: grid; gap: 9px; }
  .card[data-pri="A"] { border-left-color: var(--star); }
  .card[data-state="Sold"] { border-left-color: var(--good); }
  .card[data-state="Not now"] { opacity: 0.55; }
  .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .nm { font-weight: 800; font-size: 1.06rem; letter-spacing: -0.01em; }
  .meta { color: var(--ink-2); font-size: 0.87rem; }
  .pri { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 999px; background: var(--panel); color: var(--star-ink); }
  .why { font-size: 0.92rem; color: var(--ink); background: var(--panel); border-radius: 8px; padding: 8px 10px; }
  .who { font-size: 0.93rem; }
  .who b { font-weight: 700; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font: 700 0.9rem var(--body); text-decoration: none; padding: 9px 13px; border-radius: 10px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); }
  .btn.call { background: var(--star); border-color: var(--star); color: #0F2340; font-variant-numeric: tabular-nums; }
  .btn.ghost { color: var(--ink-2); }
  .track { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px dashed var(--rule); padding-top: 9px; }
  .track select { padding: 7px 9px; font-size: 0.86rem; }
  .note { flex: 1 1 200px; min-width: 0; font: 400 0.9rem var(--body); color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; resize: vertical; min-height: 36px; }
  .stamp { font-family: var(--mono); font-size: 0.7rem; color: var(--star-ink); }
  .empty { text-align: center; color: var(--ink-2); padding: 40px 0; }
  footer { margin-top: 28px; color: var(--ink-2); font-size: 0.85rem; }
  @media (max-width: 500px) { .btn { flex: 1 1 auto; justify-content: center; } }
</style>

<div class="wrap">
  <h1>Austin church call sheet</h1>
  <p class="sub">Churches that could buy Nativity sets for their own ministry. Tap a number to call, set where it landed, and the sheet remembers it on this device.</p>

  <div class="controls">
    <div class="row">
      <input id="q" type="search" placeholder="Search church, town, contact…" autocomplete="off">
      <select id="city"><option value="">All towns</option></select>
      <select id="state">
        <option value="">Any status</option>
        <option>Not contacted</option><option>Left message</option><option>Talked</option>
        <option>Interested</option><option>Sold</option><option>Not now</option>
      </select>
    </div>
    <div class="row">
      <button class="chip" data-pri="A" aria-pressed="true">A list</button>
      <button class="chip" data-pri="B" aria-pressed="false">B</button>
      <button class="chip" data-pri="C" aria-pressed="false">C</button>
      <button class="chip" id="hasphone" aria-pressed="false">Has a number</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="list" id="list"></div>
  <footer id="foot"></footer>
</div>

  (function () {
    var list = document.getElementById("list"), q = document.getElementById("q");
    var citySel = document.getElementById("city"), stateSel = document.getElementById("state");
    var countEl = document.getElementById("count"), foot = document.getElementById("foot");
    var pris = { A: true, B: false, C: false }, phoneOnly = false;
    var store = {};
    try { store = JSON.parse(localStorage.getItem("tek-calls") || "{}") || {}; } catch (e) { store = {}; }
    function save() { try { localStorage.setItem("tek-calls", JSON.stringify(store)); } catch (e) {} }

    var towns = [];
    LEADS.forEach(function (l) { if (towns.indexOf(l.c) < 0) towns.push(l.c); });
    towns.sort().forEach(function (t) {
      var o = document.createElement("option"); o.value = t; o.textContent = t; citySel.appendChild(o);
    });

    function esc(s) { return (s || "").replace(/[&<>"]/g, function (m) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m]; }); }
    function tel(p) { return "tel:+1" + p.replace(/\D/g, ""); }

    function card(l) {
      var st = store[l.id] || {};
      var el = document.createElement("div");
      el.className = "card";
      el.setAttribute("data-pri", l.pri);
      el.setAttribute("data-state", st.status || "Not contacted");
      var maps = "https://maps.google.com/?q=" + encodeURIComponent(l.n + " " + (l.a || "") + " " + l.c + " TX");
      var find = "https://www.google.com/search?q=" + encodeURIComponent(l.n + " " + l.c + " TX kids ministry director phone");
      var html =
        '<div class="head"><span class="nm">' + esc(l.n) + '</span><span class="pri">' + l.pri + '</span>' +
        '<span class="meta">' + esc(l.c) + (l.d ? " · " + esc(l.d) : "") + '</span></div>' +
        (l.s ? '<div class="why">' + esc(l.s) + '</div>' : "") +
        '<div class="who"><b>Ask for:</b> ' + esc(l.who || "whoever runs kids ministry") +
        (l.r ? ' — ' + esc(l.r) : "") + (l.a ? '<br><span class="meta">' + esc(l.a) + '</span>' : "") + '</div>' +
        '<div class="acts">' +
        (l.p ? '<a class="btn call" href="' + tel(l.p) + '">📞 ' + esc(l.p) + '</a>'
             : '<a class="btn" href="' + find + '" target="_blank" rel="noopener">Find the number</a>') +
        (l.e ? '<a class="btn" href="mailto:' + esc(l.e) + '">Email</a>' : "") +
        '<a class="btn ghost" href="' + maps + '" target="_blank" rel="noopener">Map</a>' +
        '<a class="btn ghost" href="' + find + '" target="_blank" rel="noopener">Look up</a>' +
        '</div>' +
        '<div class="track">' +
        '<select data-id="' + l.id + '" class="st">' +
        ["Not contacted", "Left message", "Talked", "Interested", "Sold", "Not now"].map(function (s) {
          return '<option' + ((st.status || "Not contacted") === s ? " selected" : "") + '>' + s + '</option>';
        }).join("") + '</select>' +
        '<textarea class="note" data-id="' + l.id + '" rows="1" placeholder="What they said…">' + esc(st.note || "") + '</textarea>' +
        '<span class="stamp">' + (st.when ? "last touched " + st.when : "") + '</span>' +
        '</div>';
      el.innerHTML = html;
      return el;
    }

    function stamp() {
      var d = new Date();
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function render() {
      var text = q.value.trim().toLowerCase(), city = citySel.value, status = stateSel.value;
      var shown = 0;
      list.textContent = "";
      LEADS.forEach(function (l) {
        var st = store[l.id] || {};
        if (!pris[l.pri]) return;
        if (city && l.c !== city) return;
        if (phoneOnly && !l.p) return;
        if (status && (st.status || "Not contacted") !== status) return;
        if (text) {
          var hay = (l.n + " " + l.c + " " + l.d + " " + (l.who || "") + " " + (l.s || "") + " " + (l.a || "")).toLowerCase();
          if (hay.indexOf(text) < 0) return;
        }
        list.appendChild(card(l));
        shown++;
      });
      if (!shown) {
        var e = document.createElement("div");
        e.className = "empty";
        e.textContent = "Nothing matches those filters.";
        list.appendChild(e);
      }
      var done = 0, sold = 0;
      for (var k in store) {
        if (store[k].status && store[k].status !== "Not contacted") done++;
        if (store[k].status === "Sold") sold++;
      }
      countEl.textContent = shown + " shown · " + done + " worked · " + sold + " sold";
      foot.textContent = LEADS.length + " churches. Your statuses and notes are saved on this device only, so each person keeps their own. The spreadsheet is the shared copy.";
    }

    list.addEventListener("change", function (e) {
      var t = e.target, id = t.getAttribute("data-id");
      if (!id) return;
      store[id] = store[id] || {};
      if (t.classList.contains("st")) store[id].status = t.value;
      if (t.classList.contains("note")) store[id].note = t.value;
      store[id].when = stamp();
      save();
      var c = t.closest(".card");
      if (c && t.classList.contains("st")) {
        c.setAttribute("data-state", t.value);
        var s = c.querySelector(".stamp");
        if (s) s.textContent = "last touched " + store[id].when;
      }
      if (t.classList.contains("st")) render();
    });
    list.addEventListener("input", function (e) {
      if (e.target.classList.contains("note")) {
        var id = e.target.getAttribute("data-id");
        store[id] = store[id] || {};
        store[id].note = e.target.value;
        store[id].when = stamp();
        save();
      }
    });
    [q, citySel, stateSel].forEach(function (el) { el.addEventListener("input", render); });
    [].forEach.call(document.querySelectorAll(".chip[data-pri]"), function (b) {
      b.addEventListener("click", function () {
        var p = b.getAttribute("data-pri");
        pris[p] = !pris[p];
        b.setAttribute("aria-pressed", pris[p] ? "true" : "false");
        render();
      });
    });
    document.getElementById("hasphone").addEventListener("click", function () {
      phoneOnly = !phoneOnly;
      this.setAttribute("aria-pressed", phoneOnly ? "true" : "false");
      render();
    });
    render();
  })();
</script>
